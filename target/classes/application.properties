server.port=8086
spring.application.name=store

spring.datasource.url=jdbc:postgresql://localhost:5433/lola_store
spring.datasource.username=lola
spring.datasource.password=lola
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

lola.store.s3.endpoint=http://127.0.0.1:9000
lola.store.s3.region=us-east-1
lola.store.s3.access-key=lola_admin
lola.store.s3.secret-key=lola_admin_secret
lola.store.s3.path-style-access-enabled=true
lola.store.s3.presigned-url-expiration-minutes=60

lola.lci.auth.introspect-url=http://localhost:8080/internal/v1/auth/introspect
lola.security.jwt.secret=lola-cloud-platform-secret-encryption-key-for-jwt-signing-256-bits-minimum
